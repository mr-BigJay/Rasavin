name: Windows preview installer
on:
  workflow_dispatch:
  push:
    branches: ["feat/desktop-mvp"]
jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install --no-audit --no-fund
      - run: npm run icons
      - run: npm run tauri build
      - name: Upload unsigned preview installers
        uses: actions/upload-artifact@v4
        with:
          name: Rasavin-Windows-preview
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

      - name: Publish diagnostic Windows installer in GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $source) { throw "Windows NSIS installer not found" }
          $file = "Rasavin-Setup-v0.1.2-Diagnostic.exe"
          Copy-Item $source.FullName $file
          gh release create "v0.1.2-diagnostic" $file --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Rasavin 0.1.2 - Diagnostic Windows preview" --prerelease --notes "Diagnostic preview. Lazy SQLite migration prevents database errors from blocking the window. Startup errors appear in a Windows dialog and in %LOCALAPPDATA%\Rasavin\logs\startup.log. WebView2 included for offline install. Unsigned; TEST DATA ONLY, not approved for real patient information."
