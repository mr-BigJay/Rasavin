[package]
name = "rasavin"
version = "0.1.2"
description = "Rasavin clinic management desktop application"
authors = ["Rasavin"]
edition = "2021"

[lib]
name = "rasavin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
